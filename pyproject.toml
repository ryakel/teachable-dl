[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teachable-dl"
version = "2.0.0"
description = "Download courses you are enrolled in from Teachable"
readme = "README.md"
# selenium, seleniumbase and yt-dlp all require 3.10 or newer.
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
dependencies = [
    "selenium>=4.11.2",
    "requests>=2.31.0",
    "yt-dlp>=2024.1.0",
    "seleniumbase>=4.20.8",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
teachable-dl = "teachable_dl.cli:main"

[tool.setuptools]
packages = ["teachable_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
