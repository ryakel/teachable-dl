name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package
        # Installing rather than relying on the package sitting in cwd, so a
        # broken [project.scripts] or packaging config fails here instead of
        # shipping green.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # The suite is pure logic: no browser, no network.
        run: python -m pytest -q

      - name: Check both entry points start
        run: |
          python main.py --version
          python main.py --help > /dev/null
          teachable-dl --version
          teachable-dl --help > /dev/null

      - name: Check the package imports from an unrelated directory
        # Catches a module that only resolves because ./teachable_dl is in cwd.
        run: cd "$RUNNER_TEMP" && python -c "import teachable_dl; print(teachable_dl.__version__)"

  integration:
    # Drives a real browser against the local fixture site. No account, no
    # network beyond localhost -- this is the only automated coverage of
    # template detection and curriculum scraping.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the browser integration tests
        env:
          TEACHABLE_DL_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          TEACHABLE_DL_TEST_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python -m pytest tests/test_integration.py -v

      - name: Fail if the integration tests silently skipped
        # A version-mismatched driver makes every test skip, which would
        # otherwise look identical to a pass.
        env:
          TEACHABLE_DL_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          TEACHABLE_DL_TEST_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          python -m pytest tests/test_integration.py -q 2>&1 | tee result.txt
          grep -qE "[0-9]+ passed" result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::Integration tests skipped instead of running"
            exit 1
          fi
